name: Build & Release APK

on:
  push:
    branches: [ "main", "dev" ]

permissions:
  contents: write

jobs:
  build_and_release:
    # 👇 关键修改：使用 GitHub 官方免费机器
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. 配置 Java 环境 (Android 编译必须)
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle' # 开启 Gradle 缓存，加速后续构建

    # 2. 配置 Flutter 环境
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable' # 强行使用稳定版，不再做小白鼠
        cache: true       # 开启 Flutter 依赖缓存

    - name: Get Dependencies
      run: flutter pub get

    # =========================================================
    # 步骤 A: 提取版本号
    # =========================================================
    - name: Read Version Name
      id: get_version
      run: |
        # 读取 pubspec.yaml 中的 version 字段
        RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g')
        VERSION_NAME=$(echo $RAW_VERSION | cut -d'+' -f1)
        
        echo "Detected Version Name: $VERSION_NAME"
        echo "Run Number: ${{ github.run_number }}"
        
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    # =========================================================
    # 步骤 B: 打包 APK
    # =========================================================
    - name: Build Release APK
      run: |
        # 使用 Release 模式打包
        # 注意：如果你没有配置 keystore，请确保 build.gradle 做了防呆处理
        flutter build apk --release \
          --build-name=${{ env.VERSION_NAME }} \
          --build-number=${{ github.run_number }}
        
        # 重命名产物
        mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk

    # =========================================================
    # 步骤 C: 自动发布
    # =========================================================

    # 场景 1: Main 分支 -> 正式版
    - name: Create Official Release
      if: github.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        tag: "v${{ env.VERSION_NAME }}+${{ github.run_number }}"
        name: "Release v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})"
        body: |
          🚀 正式发布
          版本: v${{ env.VERSION_NAME }}
          Build: ${{ github.run_number }}
        artifacts: "build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk"
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}

    # 场景 2: Dev 分支 -> 预览版
    - name: Create Pre-Release
      if: github.ref == 'refs/heads/dev'
      uses: ncipollo/release-action@v1
      with:
        tag: "v${{ env.VERSION_NAME }}-pre.${{ github.run_number }}"
        name: "Dev Build v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})"
        body: |
          ⚠️ 开发预览版
          分支: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
        artifacts: "build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk"
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}
