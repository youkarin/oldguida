name: Build & Release APK

on:
  push:
    branches: [ "main", "dev" ]

permissions:
  contents: write

jobs:
  build_and_release:
    # 👇 关键修改：使用 GitHub 官方免费机器
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. 配置 Java 环境 (Android 编译必须)
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle' # 开启 Gradle 缓存，加速后续构建

    # 2. 配置 Flutter 环境
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable' # 强行使用稳定版，不再做小白鼠
        cache: true       # 开启 Flutter 依赖缓存

    - name: Get Dependencies
      run: flutter pub get

    # =========================================================
    # 步骤 A: 提取版本号
    # =========================================================
    - name: Read Version Name
      id: get_version
      run: |
        # 读取 pubspec.yaml 中的 version 字段
        RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g')
        VERSION_NAME=$(echo $RAW_VERSION | cut -d'+' -f1)
        
        echo "Detected Version Name: $VERSION_NAME"
        echo "Run Number: ${{ github.run_number }}"
        
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    # =========================================================
    # 步骤 B: 打包 APK
    # =========================================================
    - name: Decode Keystore
      run: |
        if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
          echo "Error: ANDROID_KEYSTORE_BASE64 is empty"
          exit 1
        fi
        printf "%s" "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

    - name: Build Release APK
      run: |
        if [ -z "$ANDROID_KEY_ALIAS" ]; then
          echo "Error: ANDROID_KEY_ALIAS is not set. Please check your GitHub Secrets."
          exit 1
        fi
        # 使用 Release 模式打包
        flutter build apk --release \
          --build-name=${{ env.VERSION_NAME }} \
          --build-number=${{ github.run_number }}
        
        # 重命名产物
        mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk
      env:
        ANDROID_KEYSTORE_PATH: "upload-keystore.jks"
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

    # =========================================================
    # 步骤 C: 自动发布
    # =========================================================

    - name: Record Release Metadata
      run: |
        git clone --branch main --single-branch \
          "https://x-access-token:${RELEASE_TOKEN}@github.com/youkarin/Oldguida_release.git" \
          temp_release_repo
        cd temp_release_repo

        jq -n \
          --arg version "$VERSION_NAME" \
          --argjson build "$GITHUB_RUN_NUMBER" \
          --arg source_repository "$GITHUB_REPOSITORY" \
          --arg source_branch "$GITHUB_REF_NAME" \
          --arg source_commit "$GITHUB_SHA" \
          --argjson workflow_run_id "$GITHUB_RUN_ID" \
          --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
          '{
            version: $version,
            build: $build,
            source_repository: $source_repository,
            source_branch: $source_branch,
            source_commit: $source_commit,
            workflow_run_id: $workflow_run_id,
            workflow_run_attempt: $workflow_run_attempt
          }' > release.json

        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add release.json
        git commit -m "release: v${VERSION_NAME}+${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})"
        git push origin main
      env:
        RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    # 场景 1: Main 分支 -> 正式版 (同时更新固定标签 'stable')
    - name: Create Official Release
      if: github.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        tag: "stable"
        name: "v${{ env.VERSION_NAME }}+${{ github.run_number }}"
        body: |
          🚀 正式发布
          版本: v${{ env.VERSION_NAME }}
          Build: ${{ github.run_number }}
        artifacts: "build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk"
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        makeLatest: false
        owner: youkarin
        repo: Oldguida_release
        commit: "main"
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Create Versioned Official Tag
      if: github.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        tag: "v${{ env.VERSION_NAME }}+${{ github.run_number }}"
        name: "Release v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})"
        body: |
          🚀 正式发布历史记录
        artifacts: "build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk"
        allowUpdates: true
        makeLatest: true
        owner: youkarin
        repo: Oldguida_release
        commit: "main"
        token: ${{ secrets.RELEASE_TOKEN }}

    # 场景 2: Dev 分支 -> 预览版 (同时更新固定标签 'preview')
    - name: Create Pre-Release
      if: github.ref == 'refs/heads/dev'
      uses: ncipollo/release-action@v1
      with:
        tag: "preview"
        name: "v${{ env.VERSION_NAME }}+${{ github.run_number }}"
        body: |
          ⚠️ 开发预览版
          版本: v${{ env.VERSION_NAME }}
          Build: ${{ github.run_number }}
          分支: ${{ github.ref_name }}
        artifacts: "build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk"
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        makeLatest: false
        prerelease: true
        owner: youkarin
        repo: Oldguida_release
        commit: "main"
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Create Versioned Pre-Release Tag
      if: github.ref == 'refs/heads/dev'
      uses: ncipollo/release-action@v1
      with:
        tag: "v${{ env.VERSION_NAME }}-pre.${{ github.run_number }}"
        name: "Dev Build v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})"
        body: |
          ⚠️ 开发预览版历史记录
        artifacts: "build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk"
        allowUpdates: true
        prerelease: true
        owner: youkarin
        repo: Oldguida_release
        commit: "main"
        token: ${{ secrets.RELEASE_TOKEN }}
