name: Build & Release APK

on:
  push:
    # 这里配置了监听的分支
    # 1. 在 dev 提交 -> 触发构建 -> 走下面的 "Pre-Release" 逻辑
    # 2. 合并到 main -> 触发构建 -> 走下面的 "Official Release" 逻辑
    branches: [ "main", "dev" ]

permissions:
  contents: write

jobs:
  build_and_release:
    # 1. 改为自托管 Runner
    runs-on: self-hosted

    # 2. 指定运行环境 (关键！)
    # 使用 CirrusLabs 的镜像，它完美支持 Linux ARM64，且预装了 Flutter 和 Android SDK
    # 这能保证你的服务器干净，且不需要每次下载 Flutter
    container:
      image: ghcr.io/cirruslabs/flutter:3.27.1 # 建议固定一个版本，或者用 stable
      options: --user root # 避免权限问题

    steps:
    # 注意：因为使用了 Docker 容器，这里不需要 actions/setup-java 和 subosito/flutter-action
    # 容器里已经都有了

    - uses: actions/checkout@v4
      with:
        # 解决 git 在容器内的安全目录报错问题
        set-safe-directory: true 

    - name: Check Environment
      run: |
        flutter --version
        echo "Running on $(uname -m) architecture"

    - name: Get Dependencies
      run: flutter pub get

    # =========================================================
    # 步骤 A: 提取版本号
    # =========================================================
    - name: Read Version Name
      id: get_version
      run: |
        # 容器内通常默认是 sh，这里为了保险显式处理
        RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g')
        VERSION_NAME=$(echo $RAW_VERSION | cut -d'+' -f1)
        
        echo "Detected Version Name: $VERSION_NAME"
        echo "Run Number: ${{ github.run_number }}"
        
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    # =========================================================
    # 步骤 B: 打包
    # =========================================================
    - name: Build Release APK
      run: |
        # 可能需要同意 Android SDK 协议，虽然镜像通常已处理，但为了保险：
        yes | flutter doctor --android-licenses || true
        
        flutter build apk --release \
          --build-name=${{ env.VERSION_NAME }} \
          --build-number=${{ github.run_number }}
        
        mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk

    # =========================================================
    # 步骤 C: 自动发布
    # =========================================================

    # 场景 1: Main 分支 (比如合并代码后)
    - name: Create Official Release
      if: github.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        tag: "v${{ env.VERSION_NAME }}+${{ github.run_number }}"
        name: "Release v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})"
        body: |
          🚀 正式发布
          版本: v${{ env.VERSION_NAME }}
          Build: ${{ github.run_number }}
        artifacts: "build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk"
        allowUpdates: true
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}

    # 场景 2: 其他分支 (比如 dev 提交后)
    - name: Create Pre-Release
      if: github.ref != 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        tag: "v${{ env.VERSION_NAME }}-pre.${{ github.run_number }}"
        name: "Dev Build v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})"
        body: |
          ⚠️ 开发预览版
          分支: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
        artifacts: "build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk"
        allowUpdates: true
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}
