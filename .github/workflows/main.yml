name: Build & Release APK

on:
  push:
    branches: [ "main", "dev" ]

permissions:
  contents: write

jobs:
  build_and_release:
    # 1. 使用你的甲骨文 ARM 服务器
    runs-on: self-hosted

    # 2. 锁定稳定版镜像 (修复 gen_snapshot 报错的关键)
    container:
      image: ghcr.io/cirruslabs/flutter:3.27.1
      options: --user root

    steps:
    # 修复 Git 在容器内的 "dubious ownership" 报错
    - uses: actions/checkout@v4
      with:
        set-safe-directory: true 

    - name: Check Environment
      run: |
        echo "Running on $(uname -m) architecture"
        flutter --version

    # 3. 关键修复：预下载编译所需的二进制文件
    # 防止出现 "Failed to find gen_snapshot" 错误
    - name: Precache Flutter Artifacts
      run: flutter precache --android --universal

    - name: Get Dependencies
      run: flutter pub get

    # =========================================================
    # 步骤 A: 提取版本号
    # =========================================================
    - name: Read Version Name
      id: get_version
      run: |
        # 读取 pubspec.yaml 中的 version 字段
        RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g')
        VERSION_NAME=$(echo $RAW_VERSION | cut -d'+' -f1)
        
        echo "Detected Version Name: $VERSION_NAME"
        echo "Run Number: ${{ github.run_number }}"
        
        # 保存到环境变量
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    # =========================================================
    # 步骤 B: 打包 APK
    # =========================================================
    - name: Build Release APK
      run: |
        # 再次确认协议 (防止首次运行卡住)
        yes | flutter doctor --android-licenses || true
        
        flutter build apk --release \
          --build-name=${{ env.VERSION_NAME }} \
          --build-number=${{ github.run_number }}
        
        # 重命名产物
        mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk

    # =========================================================
    # 步骤 C: 自动发布
    # =========================================================

    # 场景 1: Main 分支 -> 正式版
    - name: Create Official Release
      if: github.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        tag: "v${{ env.VERSION_NAME }}+${{ github.run_number }}"
        name: "Release v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})"
        body: |
          🚀 正式发布
          显示版本: v${{ env.VERSION_NAME }}
          内部版本号: ${{ github.run_number }}
          构建分支: Main
        artifacts: "build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk"
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}

    # 场景 2: Dev 分支 -> 预览版
    - name: Create Pre-Release
      if: github.ref == 'refs/heads/dev'
      uses: ncipollo/release-action@v1
      with:
        tag: "v${{ env.VERSION_NAME }}-pre.${{ github.run_number }}"
        name: "Pre-release v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})"
        body: |
          ⚠️ 开发预览版
          显示版本: v${{ env.VERSION_NAME }}
          内部版本号: ${{ github.run_number }}
          构建分支: Dev
        artifacts: "build/app/outputs/flutter-apk/GuidaGuru_v${{ env.VERSION_NAME }}.apk"
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}
